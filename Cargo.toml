[package]
name = "ida-init"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cliclack = "0.5.5"

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
lnks = "0.2.0"
rfd = { version = "0.17.2", default-features = false }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
debug = "line-tables-only"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
